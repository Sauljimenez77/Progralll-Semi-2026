
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios</title>
    <link rel="stylesheet" href="/estilos.css">
</head>

<body>

    <main class="contenedor">

        <header>
            <div>
                <h1>Gestión de Usuarios</h1>
            </div>

            <button id="salir" hidden>
                Cerrar sesión
            </button>
        </header>

        <div id="aviso" role="status"></div>

        <!-- INICIO DE SESIÓN -->

        <section id="acceso">

            <h2 id="titulo-acceso">
                Iniciar sesión
            </h2>

            <p id="nota-acceso"></p>

            <form id="form-login">

                <label>
                    Usuario
                    <input
                        name="usuario"
                        required
                        maxlength="35"
                        autocomplete="username"
                    >
                </label>

                <label>
                    Contraseña
                    <input
                        name="clave"
                        type="password"
                        required
                        autocomplete="current-password"
                    >
                </label>

                <button type="submit">
                    Ingresar
                </button>

            </form>

        </section>

        <!-- PANEL DE USUARIOS -->

        <section id="panel" hidden>

            <div class="barra">

                <h2>
                    Administración de usuarios
                </h2>

                <button id="nuevo">
                    + Registrar usuario
                </button>

            </div>

            <!-- BUSCAR USUARIOS -->

            <div class="busqueda">

                <input
                    id="buscar"
                    placeholder="Buscar por usuario o nombre"
                >

                <button id="btn-buscar">
                    Buscar
                </button>

            </div>

            <div id="tabla"></div>

            <!-- REGISTRAR Y EDITAR USUARIOS -->

            <div id="editor" hidden>

                <h3 id="titulo-form">
                    Nuevo usuario
                </h3>

                <form id="form-usuario">

                    <input
                        name="idUsuario"
                        type="hidden"
                    >

                    <label>
                        Usuario
                        <input
                            name="usuario"
                            maxlength="35"
                            required
                        >
                    </label>

                    <label>
                        Contraseña

                        <span id="ayuda-clave"></span>

                        <input
                            name="clave"
                            type="password"
                            minlength="6"
                        >
                    </label>

                    <label>
                        Nombre
                        <input
                            name="nombre"
                            maxlength="85"
                            required
                        >
                    </label>

                    <label>
                        Dirección
                        <input
                            name="direccion"
                            maxlength="100"
                            required
                        >
                    </label>

                    <label>
                        Teléfono
                        <input
                            name="telefono"
                            maxlength="9"
                            pattern="[0-9]{8,9}"
                            required
                        >
                    </label>

                    <div class="acciones">

                        <button type="submit">
                            Guardar
                        </button>

                        <button
                            type="button"
                            id="cancelar"
                            class="secundario"
                        >
                            Cancelar
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>

    <script src="/app.js"></script>

</body>

</html>
